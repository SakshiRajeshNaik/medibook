services:
  mongo:
    image: mongo:7
    container_name: medibook-mongo
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: YOUR_DOCKERHUB_USERNAME/medibook-api:latest
    container_name: medibook-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/medibook
      JWT_SECRET: medibook-prod-secret-2026
      CLIENT_URL: http://YOUR_VM_IP:8080
      SLOT_LOCK_MINUTES: 5
      CONSULTATION_FEE: 500
      STRIPE_SECRET_KEY: ""
      SMTP_HOST: ""
      SMTP_PORT: 587
      SMTP_USER: ""
      SMTP_PASS: ""
      SMTP_FROM: "MediBook <noreply@medibook.local>"
      TWILIO_ACCOUNT_SID: ""
      TWILIO_AUTH_TOKEN: ""
      TWILIO_PHONE_NUMBER: ""
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  frontend:
    image: YOUR_DOCKERHUB_USERNAME/medibook-frontend:latest
    container_name: medibook-frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    container_name: medibook-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - frontend
    restart: unless-stopped

volumes:
  mongo-data:
