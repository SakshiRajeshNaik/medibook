name: CI/CD — MediBook

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # ── Build & Health Check ─────────────────────────────────────────────────────
  build:
    name: Build & Health Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate project structure
        run: |
          test -f backend/src/server.js
          test -f frontend/src/App.jsx
          test -f docker-compose.yml
          echo "✅ Project structure valid"

      - name: Build Docker images
        run: docker compose build

      - name: Start services
        run: |
          docker compose up -d
          echo "Waiting for services to be healthy..."
          sleep 30

      - name: Health check
        run: |
          curl -f http://localhost:8080/api/health
          echo "✅ Health check passed"

      - name: Stop services
        if: always()
        run: docker compose down -v

  # ── Deploy via Render (auto on push to main) ─────────────────────────────────
  deploy:
    name: Trigger Render Deploy
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - name: Deploy Backend to Render
        run: |
          curl -s -X POST "${{ secrets.RENDER_DEPLOY_HOOK_API }}" \
            -H "Content-Type: application/json" \
            | echo "✅ Backend deploy triggered"

      - name: Deploy Frontend to Render
        run: |
          curl -s -X POST "${{ secrets.RENDER_DEPLOY_HOOK_FRONTEND }}" \
            -H "Content-Type: application/json" \
            | echo "✅ Frontend deploy triggered"
