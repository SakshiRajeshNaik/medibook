name: CI/CD — MediBook

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  IMAGE_API: ${{ secrets.DOCKER_USERNAME }}/medibook-api
  IMAGE_FRONTEND: ${{ secrets.DOCKER_USERNAME }}/medibook-frontend

jobs:
  # ── 1. Build & Test ──────────────────────────────────────────────────────────
  build:
    name: Build & Health Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate project structure
        run: |
          test -f backend/src/server.js
          test -f frontend/src/App.jsx
          test -f docker-compose.yml
          echo "✅ Project structure valid"

      - name: Build Docker images
        run: docker compose build

      - name: Start services
        run: |
          docker compose up -d
          echo "Waiting for services to be healthy..."
          sleep 30

      - name: Health check
        run: |
          curl -f http://localhost:8080/api/health
          echo "✅ Health check passed"

      - name: Stop services
        if: always()
        run: docker compose down -v

  # ── 2. Push to Docker Hub ────────────────────────────────────────────────────
  push:
    name: Push Images to Docker Hub
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push API image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.IMAGE_API }}:latest
            ${{ env.IMAGE_API }}:${{ github.sha }}

      - name: Build & Push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          build-args: |
            VITE_API_URL=/api
          tags: |
            ${{ env.IMAGE_FRONTEND }}:latest
            ${{ env.IMAGE_FRONTEND }}:${{ github.sha }}

      - name: Image digest summary
        run: |
          echo "✅ API image pushed: ${{ env.IMAGE_API }}:latest"
          echo "✅ Frontend image pushed: ${{ env.IMAGE_FRONTEND }}:latest"

  # ── 3. Deploy to Kubernetes ──────────────────────────────────────────────────
  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: push
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: latest

      - name: Configure kubectl
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > $HOME/.kube/config

      - name: Replace image names in manifests
        run: |
          sed -i "s|DOCKERHUB_USERNAME|${{ secrets.DOCKER_USERNAME }}|g" k8s/api-deployment.yaml
          sed -i "s|DOCKERHUB_USERNAME|${{ secrets.DOCKER_USERNAME }}|g" k8s/frontend-deployment.yaml

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/secret.yaml
          kubectl apply -f k8s/nginx-deployment.yaml
          kubectl apply -f k8s/api-deployment.yaml
          kubectl apply -f k8s/frontend-deployment.yaml

      - name: Update images to latest
        run: |
          kubectl set image deployment/medibook-api api=${{ env.IMAGE_API }}:${{ github.sha }} -n medibook
          kubectl set image deployment/medibook-frontend frontend=${{ env.IMAGE_FRONTEND }}:${{ github.sha }} -n medibook

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/medibook-api -n medibook --timeout=120s
          kubectl rollout status deployment/medibook-frontend -n medibook --timeout=120s
          kubectl rollout status deployment/medibook-nginx -n medibook --timeout=60s

      - name: Deployment summary
        run: |
          echo "✅ Deployment complete"
          kubectl get pods -n medibook
          kubectl get services -n medibook
