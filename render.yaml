services:
  # ── Backend API ──────────────────────────────────────────────────────────────
  - type: web
    name: medibook-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    branch: main
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: SLOT_LOCK_MINUTES
        value: 5
      - key: CONSULTATION_FEE
        value: 500
      - key: LOG_LEVEL
        value: info

  # ── Frontend ─────────────────────────────────────────────────────────────────
  - type: web
    name: medibook-frontene
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    branch: main
    dockerBuildArgs:
      - key: VITE_API_URL
        value: https://medibook-dteq.onrender.com/api
