services:
  # ── Backend API ──────────────────────────────────────────────────────────────
  - type: web
    name: medibook-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    branch: main
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: SLOT_LOCK_MINUTES
        value: 5
      - key: CONSULTATION_FEE
        value: 500
      - key: LOG_LEVEL
        value: info
      - key: STRIPE_SECRET_KEY
        value: ""
      - key: STRIPE_WEBHOOK_SECRET
        value: ""
      - key: SMTP_HOST
        value: ""
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        value: ""
      - key: SMTP_PASS
        value: ""
      - key: SMTP_FROM
        value: "MediBook <noreply@medibook.local>"
      - key: TWILIO_ACCOUNT_SID
        value: ""
      - key: TWILIO_AUTH_TOKEN
        value: ""
      - key: TWILIO_PHONE_NUMBER
        value: ""

  # ── Frontend ─────────────────────────────────────────────────────────────────
  - type: web
    name: medibook-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    branch: main
    buildArgs:
      - key: VITE_API_URL
        value: https://medibook-api.onrender.com/api
