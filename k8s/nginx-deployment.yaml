apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: medibook
data:
  default.conf: |
    upstream api_backend {
        server medibook-api:5000;
    }
    upstream web_frontend {
        server medibook-frontend:80;
    }
    server {
        listen 80;
        server_name localhost;
        client_max_body_size 10M;

        location /socket.io/ {
            proxy_pass http://api_backend/socket.io/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 86400;
        }
        location /api/ {
            proxy_pass http://api_backend/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location / {
            proxy_pass http://web_frontend/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: medibook-nginx
  namespace: medibook
  labels:
    app: medibook-nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: medibook-nginx
  template:
    metadata:
      labels:
        app: medibook-nginx
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
      volumes:
        - name: nginx-config
          configMap:
            name: nginx-config
---
apiVersion: v1
kind: Service
metadata:
  name: medibook-nginx
  namespace: medibook
spec:
  type: NodePort
  selector:
    app: medibook-nginx
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
