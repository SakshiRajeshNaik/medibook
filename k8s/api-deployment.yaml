apiVersion: apps/v1
kind: Deployment
metadata:
  name: medibook-api
  namespace: medibook
  labels:
    app: medibook-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: medibook-api
  template:
    metadata:
      labels:
        app: medibook-api
    spec:
      containers:
        - name: api
          image: DOCKERHUB_USERNAME/medibook-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          envFrom:
            - secretRef:
                name: medibook-secret
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 40
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: medibook-api
  namespace: medibook
spec:
  selector:
    app: medibook-api
  ports:
    - port: 5000
      targetPort: 5000
