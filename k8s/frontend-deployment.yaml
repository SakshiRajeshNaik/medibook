apiVersion: apps/v1
kind: Deployment
metadata:
  name: medibook-frontend
  namespace: medibook
  labels:
    app: medibook-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: medibook-frontend
  template:
    metadata:
      labels:
        app: medibook-frontend
    spec:
      containers:
        - name: frontend
          image: DOCKERHUB_USERNAME/medibook-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: medibook-frontend
  namespace: medibook
spec:
  selector:
    app: medibook-frontend
  ports:
    - port: 80
      targetPort: 80
